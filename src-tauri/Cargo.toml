[package]
name = "spice-route"
version = "1.6.8"
description = "Verified, recoverable Codex handoffs through your cloud drive"
authors = ["Spice Route"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "spice_route_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spice-route-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
