[package]
name = "spice-route-core"
version = "0.3.2"
description = "Portable Codex snapshot, compatibility, and recovery engine"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
dunce = "1"
fs2 = "0.4"
globset = "0.4"
hostname = "0.4"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
pretty_assertions = "1"
